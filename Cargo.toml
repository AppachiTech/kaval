[package]
name = "kaval"
version = "0.2.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "Guard your ports. A developer-focused port and process manager TUI."
repository = "https://github.com/AppachiTech/kaval"
homepage = "https://www.appachi.tech/kaval/"
readme = "README.md"
authors = ["Madhubalan Appachi <madhu@appachi.tech>"]
keywords = ["port", "process", "tui", "cli", "network"]
categories = ["command-line-utilities", "network-programming"]
default-run = "kav"
# Repository-only files: the crate needs src/, tests/, build.rs and the docs.
exclude = ["demo/", ".github/", "docs/", "CLAUDE.md", "Makefile"]

[[bin]]
name = "kav"
path = "src/main.rs"

[dependencies]
# crossterm is used through ratatui's re-export (ratatui::crossterm) so only one version is built.
ratatui = "0.30"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
clap_mangen = "0.2"
sysinfo = { version = "0.39", default-features = false, features = ["system", "user"] }
libc = "0.2"
socket2 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal-colorsaurus = "1"
# WATCH: low-activity upstream; wraps platform-specific syscalls (macOS: proc_pidfdinfo,
# Linux: procfs). Most likely breakage point on OS upgrades.
# Migration: /proc/net/tcp on Linux (no crate needed); proc-info crate on macOS.
netstat2 = "0.11"
anyhow = "1.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
